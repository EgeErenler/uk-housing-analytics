name: Analyse

# Runs every day. HM Land Registry adds new sales once a month (around the 20th
# working day), so a daily run picks up each release on the day it appears.
# The workflow downloads the yearly files, runs every SQL analysis and publishes
# the dashboard. Results are saved to the `results` branch only when they change.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "sql/**"
      - "src/**"
      - ".github/workflows/analyse.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: analyse
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UKH_RAW_DIR: data/raw
      UKH_DB_PATH: data/housing.duckdb
      UKH_OUTPUT_DIR: outputs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # Past years never change, so their files are cached between runs.
      - name: Cache downloaded files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ppd-raw-${{ github.run_id }}
          restore-keys: ppd-raw-

      - name: Download, load and analyse
        run: ukhousing all

      - name: Build the dashboard
        run: |
          ukhousing site --out site
          mkdir -p site/data && cp outputs/*.csv site/data/

      - name: Save results to the results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r outputs /tmp/outputs
          git fetch origin results || true
          git switch --orphan results-new
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name data ! -name site -exec rm -rf {} +
          cp /tmp/outputs/*.csv .
          printf '# Results\n\nCSV outputs of every SQL analysis, refreshed by the Analyse workflow.\n' > README.md
          git add *.csv README.md
          git commit -q -m "Results as of $(date -u +%Y-%m-%d)"
          if git diff --quiet origin/results results-new -- 2>/dev/null; then
            echo "Results unchanged, nothing to push"
          else
            git push -q --force origin results-new:results
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: analyse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
