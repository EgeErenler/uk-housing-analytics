name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQL logic and full pipeline on sample data)
        run: pytest -q
      - name: Build the site from sample data
        env:
          UKH_RAW_DIR: .ci/raw
          UKH_DB_PATH: .ci/housing.duckdb
          UKH_OUTPUT_DIR: .ci/outputs
        run: |
          ukhousing sample
          ukhousing load
          ukhousing analyse
          ukhousing site --out .ci/site
